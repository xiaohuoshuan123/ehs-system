# Render Blueprint - 永杰集团 EHS 系统一键部署
# https://render.com/docs/blueprint-spec

# ===== PostgreSQL 数据库 =====
databases:
  - name: ehs-postgres
    plan: basic-256mb
    databaseName: ehs
    user: ehs
    region: singapore
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere

# ===== 非数据库服务 =====
services:
  # ===== 后端 API (Node.js) =====
  - type: web
    name: ehs-backend
    runtime: node
    plan: starter
    region: singapore
    repo: https://github.com/xiaohuoshuan123/ehs-system.git
    branch: main
    buildCommand: npm ci && npx prisma generate
    startCommand: node src/index.js
    preDeployCommand: node docker-entrypoint.sh --migrate-only
    workingDirectory: backend
    nodeVersion: 20.11.1
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: ehs-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: UPLOAD_DIR
        value: /opt/render/uploads
      - key: ALLOWED_ORIGINS
        value: "https://ehs-frontend.onrender.com"
    disk:
      name: uploads
      mountPath: /opt/render/uploads

  # ===== 前端静态站点 =====
  - type: web
    name: ehs-frontend
    runtime: static
    plan: starter
    region: singapore
    repo: https://github.com/xiaohuoshuan123/ehs-system.git
    branch: main
    buildCommand: npm ci && npx vite build
    publishPath: dist
    workingDirectory: frontend
