# Render Blueprint - 永杰集团 EHS 系统一键部署
# https://render.com/docs/blueprint-spec

# ===== PostgreSQL 数据库 =====
databases:
  - name: ehs-postgres
    plan: basic-256mb
    databaseName: ehs
    user: ehs
    region: singapore

# ===== 服务 =====
services:
  # ===== 后端 API (Docker 构建，Dockerfile 在 backend/ 子目录) =====
  - type: web
    name: ehs-backend
    runtime: docker
    plan: starter
    region: singapore
    repo: https://github.com/xiaohuoshuan123/ehs-system.git
    branch: main
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: DATABASE_URL
        fromDatabase:
          name: ehs-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: UPLOAD_DIR
        value: /app/uploads
      - key: ALLOWED_ORIGINS
        value: "https://ehs-frontend.onrender.com"

  # ===== 前端 (Docker 构建，Nginx 静态站点) =====
  - type: web
    name: ehs-frontend
    runtime: docker
    plan: starter
    region: singapore
    repo: https://github.com/xiaohuoshuan123/ehs-system.git
    branch: main
    dockerfilePath: frontend/Dockerfile
    dockerContext: .
